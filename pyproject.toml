[project]
name = "tournament-highlight"
version = "0.1.0"
description = "Turn HEMA tournament footage into a music-cut highlight reel"
requires-python = ">=3.12"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "librosa>=0.10.1",
    # librosa pulls numba, and numba/llvmlite stopped shipping Intel-macOS wheels after
    # 0.62/0.45. Uncapped there, pip falls back to an llvmlite sdist that needs cmake and a
    # local LLVM. The cap is scoped to the platform that needs it.
    'numba<0.62; sys_platform == "darwin" and platform_machine == "x86_64"',
    "soundfile>=0.12",
    "onnxruntime>=1.17",
    "pydantic>=2.6",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "pillow>=10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
hlreel = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_ffmpeg: requires ffmpeg/ffprobe on the host; skipped when absent",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI arguments as call expressions in parameter defaults; that is the
# framework's interface, not the mutable-default hazard B008 exists to catch.
"app/cli.py" = ["B008"]
